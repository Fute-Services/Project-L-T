document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='aerialMode'){state.aerialMode=b.dataset.mode;showLocation(state.view);}else if(a==='siteFocus'){state.siteFocus=b.dataset.focus;showLocation(state.view);}else if(a==='previewGroup'){state.locGroup=b.dataset.group;state.locChoice=0;showLocation(state.view);}else if(a==='view')go(b.dataset.view);else if(a==='menu')openDrawer('menu');else if(a==='review')openDrawer('review');else if(a==='brochure')openDrawer('brochure');else if(a==='bookNext'&&bookFlip)bookFlip.flipNext();else if(a==='bookPrev'&&bookFlip)bookFlip.flipPrev();else if(a==='close')closeDrawer();else if(a==='locSelect'){state.locChoice=Number(b.dataset.choice);showLocation(state.view);}else if(a==='connections')openDrawer('connections');else if(a==='filterConnections'){state.connectionFilter=b.dataset.filter;openDrawer('connections');}else if(a==='access')openDrawer('access');else if(a==='accessTab'){state.accessTab=b.dataset.tab;openDrawer('access');}else if(a==='motion'){state.motionPaused=!state.motionPaused;updateMotion();toast(state.motionPaused?'Motion paused.':'Motion resumed.');}else if(a==='fullscreen')fullscreen();else if(a==='plan'){state.plan=b.dataset.plan;state.zoom=1;state.panX=state.panY=0;show();}else if(a==='zoomIn')zoom(.25);else if(a==='zoomOut')zoom(-.25);else if(a==='fit'){state.zoom=1;state.panX=state.panY=0;applyPlan();}else if(a==='concept'){state.concept=Number(b.dataset.concept);show();}else if(a==='gallery')go('gallery');else if(a==='galPrev')galGo(-1);else if(a==='galNext')galGo(1);else if(a==='cafeteriaPlan'){state.plan='cafeteria';go('plans');}else if(a==='export')exportNotes();});
backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeDrawer();});
document.addEventListener('keydown',e=>{if(drawerMode){if(drawerMode==='brochure'&&bookFlip&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();e.key==='ArrowRight'?bookFlip.flipNext():bookFlip.flipPrev();return;}if(e.key==='Escape'){e.preventDefault();closeDrawer();return;}if(e.key==='Tab'){const els=[...drawer.querySelectorAll('button,a,input,select,textarea,[tabindex="0"]')].filter(n=>!n.disabled);if(!els.length)return;const first=els[0],last=els.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===drawer)){e.preventDefault();last.focus();}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===drawer)){e.preventDefault();first.focus();}}return;}if(e.target.closest('input,textarea,select,#planViewport'))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const i=ORDER.indexOf(state.view),j=e.key==='ArrowRight'?Math.min(ORDER.length-1,i+1):Math.max(0,i-1);if(i>=0)go(ORDER[j]);}});
window.addEventListener('resize',()=>{fitLocationPin();if(state.view==='plans')applyPlan();});
show();updateMotion();

window.reviewPrototype={go,assets:A,state,chapter,feedback};
